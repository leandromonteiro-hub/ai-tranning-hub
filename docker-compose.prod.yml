# Produção (VPS): Caddy na frente com HTTPS automático; Postgres/Redis SEM portas
# no host; sem Streamlit legado; sem DEV_AUTO_LOGIN; worker + beat separados.
# Uso: docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aath_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aath_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aath_api
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aath_worker
    restart: unless-stopped
    command: celery -A app.jobs.celery_app.celery worker --loglevel=INFO
    env_file: .env
    # NÃO REMOVER. Sem init, o PID 1 do container é o master do Celery, que não
    # faz reap de processos órfãos. Um healthcheck que estoura o timeout faz o
    # Docker matar o `sh` e reparentar os filhos ao PID 1 — cada timeout deixava
    # um zumbi permanente. Em 2026-07-28 havia 9.459 zumbis acumulados; os PIDs
    # esgotaram o limite e o worker passou a falhar com "RuntimeError: can't
    # start new thread", derrubando o garmin_beat_sync_all.
    # Com init, o tini vira PID 1 e faz o reap.
    init: true
    # O check anterior era `celery inspect ping`, e tinha dois defeitos:
    #
    # 1. CARO E FRÁGIL: 4,2s importando a aplicação + ~6s no ping = 10,4s, contra
    #    um timeout de 10s. Em 2026-07-30 a inclusão dos módulos da Whoop
    #    empurrou o import para cima e o check passou a falhar sozinho, com o
    #    worker executando tasks normalmente. Era ele também que gerava os
    #    zumbis descritos acima, a cada timeout.
    # 2. SINAL ERRADO: no incidente de 2026-07-28 o worker respondia ao ping e
    #    mesmo assim não conseguia executar NENHUMA task. O check teria ficado
    #    verde o incidente inteiro.
    #
    # Este check prova só o que consegue provar: o processo está vivo (0,16s). A
    # funcionalidade real é coberta pelo heartbeat de 15 min (app/jobs/health_job.py),
    # que percorre beat → redis → worker → banco e alerta por email quando o
    # caminho quebra — ver docs/ops/alerta-de-job-quebrado.md.
    #
    # O COLCHETE EM '[c]elery' É OBRIGATÓRIO, não estilo. Sem ele o padrão casa
    # com a linha de comando do PRÓPRIO grep, que também contém "celery" — e o
    # check passaria a reportar "vivo" com o worker morto. Verificado: sem
    # colchete o teste se enxerga; com colchete, não. `pgrep` não serve porque
    # a imagem (python:3.12-slim) não traz procps.
    healthcheck:
      test: ["CMD-SHELL", "grep -qsa '[c]elery.*worker' /proc/*/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # O beat agenda o sync diário do Garmin (garmin_beat_sync_all). Em dev ele não
  # existe — o schedule em celery_app.py só dispara com este processo rodando.
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aath_beat
    restart: unless-stopped
    command: celery -A app.jobs.celery_app.celery beat --loglevel=INFO
    env_file: .env
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        # NEXT_PUBLIC_* é embutido no bundle no BUILD — mudar exige rebuild do web.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: aath_web
    restart: unless-stopped
    environment:
      - API_BASE_URL=http://api:8000/api/v1
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    container_name: aath_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Domínio público servido pelo Caddy (HTTPS automático via Let's Encrypt).
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
